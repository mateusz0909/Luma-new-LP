<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02030a" />
      <stop offset="40%" stop-color="#040d38" />
      <stop offset="100%" stop-color="#0012da" />
    </linearGradient>
    <radialGradient id="outerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6985ff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#4d61d8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3443a6" stop-opacity="0.4" />
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c8d6ff" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS-style smooth squircle container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Breathing Halo -->
  <circle cx="256" cy="256" r="190" fill="url(#outerOrb)" />

  <!-- Mid Concentric Ring -->
  <circle cx="256" cy="256" r="120" fill="#4d61d8" opacity="0.3" />

  <!-- Core Pulsing Light -->
  <circle cx="256" cy="256" r="68" fill="url(#innerGlow)" filter="url(#glow)" />
</svg>
